name: Scrape DK noteringer

# Kører scraperen for Nationalbanken (FX), Danish Crown (gris/kreatur),
# Arla (mælkepris) og SEGES Farmtal (korn) via Playwright på en headless
# Chromium. Committer JSON-ændringer til main, hvis output ændrer sig.
#
# Cron tidspunkter (UTC): 07:05, 11:05, 15:05, 19:05 — alle hverdage.
# Det rammer dansk arbejdstid (08-21 CET/CEST) og holder data friske flere
# gange dagligt uden at fyre workflow off uden for noteringernes tidsvindue.

on:
  schedule:
    - cron: "5 7,11,15,19 * * 1-5"
  workflow_dispatch:
    inputs:
      which_set:
        description: "Hvilket sæt at skrive (basico|completo|all)"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: scrape-noteringer-dk
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install --upgrade pip
          pip install playwright pypdf
          playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python tools/scrape_country.py --set ${{ github.event.inputs.which_set || 'all' }} --verbose

      - name: Show resulting data
        run: |
          ls -la data/
          echo "--- noteringer-dk.json ---"
          head -c 2000 data/noteringer-dk.json || true
          echo
          echo "--- noteringer-dk-completas.json ---"
          head -c 2000 data/noteringer-dk-completas.json || true

      - name: Upload scraper debug dumps (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: data/_debug_*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noteringer-dk.json data/noteringer-dk-completas.json data/noteringer-historik.json
          # Debug dumps stay out of the repo — they live in workflow artifacts only.
          rm -f data/_debug_*.txt
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): refresh DK noteringer ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            # Retry robusto: em falha de push (500 do GitHub ou corrida com
            # outro job) realinhamos com origin/main e RE-EXECUTAMOS o produtor
            # sobre o estado remoto. Rebase nao serve: conflita nos arquivos
            # gerados e deixa o repo em detached HEAD (falha de 2026-08-17).
            n=0
            until git push origin HEAD:main; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then echo "push falhou apos 3 tentativas"; exit 1; fi
              echo "push falhou (tentativa $n/3) - realinhando com origin/main"
              sleep 15
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
              git checkout -B main 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              python tools/scrape_country.py --set all
              git add data/noteringer-dk.json data/noteringer-dk-completas.json data/noteringer-historik.json
              if git diff --cached --quiet; then
                echo "Nada a enviar apos realinhar - remoto ja atualizado."
                exit 0
              fi
              git commit -m "chore(data): refresh DK noteringer ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            done
          fi
